<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>tictactoe</title>
  </head>
  <body>
  <header>
    <h1 class="title-tictactoe">tictactoe</h1>
    <div class="container-score">
      <p id="score-player1"></p>
      <p id="score-player2"></p>
    </div>
  </header>
  <div class="game">
    <div id="settings">
      <button id="mute" type="button" class="btn-pixel btn-pixel--dark">Mute</button>
      <button id="setup-menu" type="button" class="btn-pixel btn-pixel--dark">Menu</button>
    </div>
    <div>
      <h4 class="title-history blink">Game history</h4>
      <ul id="history"></ul>
      <button id="delete-history" type="button" class="btn-pixel btn-pixel--dark">Delete</button>
    </div>
    <audio src="./src/assets/2021-08-30_-_Boss_Time_-_www.FesliyanStudios.com.mp3" loop></audio>
    <main class="container-game">
      <div id="board"></div>
    </main>
    <div class="setup-form-overlay">
      <form id="setup-form" class="setup-form">
        <fieldset class="label-setup-form">
          <legend>Mode de jeu</legend>
          <label>
            <input type="radio" name="mode" value="solo" checked>
            1 joueur (contre l'IA)
          </label>
          <label>
            <input type="radio" name="mode" value="duo" id="input-duo">
            2 joueurs
          </label>
        </fieldset>
        <label class="label-setup-form">
          Pseudo
          <input type="text" name="username" maxlength="16" required  pattern=".*\S.*"/>
        </label>
        <label class="label-setup-form" data-mode="duo">
          Pseudo joueur 2
          <input type="text" name="username2" maxlength="16"  pattern=".*\S.*"/>
        </label>
        <label class="label-setup-form">
          Taille du tableau
          <select name="size">
            <option value="3">Défaut 3x3</option>
            <option value="4">4x4</option>
            <option value="5">5x5</option>
            <option value="6">6x6</option>
          </select>
        </label>
        <label class="label-setup-form">
          Choix du pion
          <select name="pawn">
            <option value="X">X</option>
            <option value="O">O</option>
          </select>
        </label>
        <label class="label-setup-form" data-mode="solo">
          Difficulté
          <select name="difficulty">
            <option value="easy">Facile</option>
            <option value="normal">Normal</option>
          </select>
        </label>
        <button type="submit" class="btn-pixel btn-pixel--dark">Valider</button>
        <button type="button" id="close-menu" class="btn-pixel btn-pixel--dark">Fermer</button>
      </form>
    </div>
  </div>
  <dialog id="end-screen">
    <div class="end-screen-panel">
      <p class="end-screen-title blink">Game Over</p>
      <p class="end-message"></p>
      <div class="container-restart">
        <button type="button" class="restart-dialog btn-pixel">Rejouer</button>
        <button type="button" class="new-game-dialog btn-pixel">Nouvelle partie</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="src/main.ts"></script>
  </body>
</html>
